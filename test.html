<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RIG SSE + Replay Test</title>
  </head>
  <body>
    <h1>RIG SSE – Replay + Live Demo</h1>
    <pre
      id="log"
      style="
        background: #f8f8f8;
        padding: 1rem;
        max-height: 80vh;
        overflow-y: scroll;
      "
    ></pre>

    <script>
      // Helper to get a cookie by name
      function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(";").shift();
        return null;
      }

      const clientId = getCookie("rig_redis_client_id");
      const subs = [
        {
          eventType: "event-type-1",
          oneOf: [{}],
        },
      ];

      const subsJson = JSON.stringify(subs);
      const subsParam = encodeURIComponent(subsJson);

      let eventSourceUrl = "http://localhost:4000/_rig/v1/connection/sse?";
      if (clientId) {
        eventSourceUrl += `rig_redis_client_id=${clientId}&`;
      }
      eventSourceUrl += `subscriptions=${subsParam}`;

      // STEP 5) Grab the <pre> for logging:
      const logEl = document.getElementById("log");
      function log(msg) {
        const line = document.createElement("div");
        line.textContent = msg;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
      }

      // Show the URL in the log so you can verify it matches your curl test:
      log(`→ Connecting to SSE at: ${eventSourceUrl}`);

      // STEP 6) Actually open the EventSource:
      const es = new EventSource(eventSourceUrl);

      // 6a) When the low-level TCP connection opens
      es.addEventListener("open", () => {
        log("[SSE] Connection opened");
      });

      // 6b) Handshake events ("rig.connection.create" and "rig.subscriptions_set")
      es.addEventListener("rig.connection.create", (evt) => {
        log(`[rig.connection.create] ${evt.data}`);
        const parsed = JSON.parse(evt.data);
        const clientId = parsed.data.client_id;
        log(`[rig.connection.create] clientId: ${clientId}`);
        if (clientId) {
          document.cookie = `rig_redis_client_id=${clientId}; Path=/; Max-Age=31536000; SameSite=Lax`;
        }
      });
      es.addEventListener("rig.subscriptions_set", (evt) => {
        log(`[rig.subscriptions_set]  ${evt.data}`);
      });

      // 6c) Listen for the CloudEvent frames of type "event-type-1":
      //     This is exactly the SSE event name RIG will emit for each matching replayed or live message.
      es.addEventListener("event-type-1", (evt) => {
        log(`[event-type-1] Raw data: ${evt.data}`);
        try {
          const parsed = JSON.parse(evt.data);
          // Extract partition and offset if present
          const partition = parsed["x-kafka-partition"];
          const offset = parsed["x-kafka-offset"];
          const clientId = getCookie("rig_redis_client_id") || "(none)";
          log(
            `[event-type-1] clientId: ${clientId} | partition: ${partition} | offset: ${offset}\n` +
            JSON.stringify(parsed, null, 2)
          );
        } catch (err) {
          log(`[event-type-1] JSON.parse error: ${err}`);
        }
      });

      // 6d) If RIG ever emits a "rig.offset_error", show it
      es.addEventListener("rig.offset_error", (evt) => {
        log(`[rig.offset_error] ${evt.data}`);
      });

      // 6e) Comments ("heartbeat") come in as empty "message" frames.
      //     Browsers don't expose comment lines directly, but "onmessage" fires with evt.data=="".
      es.onmessage = (evt) => {
        console.log("evt.data", evt.data);
        if (evt.data.trim() === "") {
          log(`[heartbeat] (empty frame)`);
        } else {
          // If for some reason you get an un‐typed "message" (SSE default), show it here:
          log(`[message] ${evt.data}`);
        }
      };

      // 6f) Network-level or parse errors end up here
      es.onerror = (err) => {
        log(`[SSE error] ${err}`);
      };
    </script>
  </body>
</html>
